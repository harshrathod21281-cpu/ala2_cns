<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malware Threat Lab | CNS ALA-2</title>
<style>
:root{--bg:#10132b;--card:#1b2042;--card2:#252b57;--tx:#eaeefb;--mut:#a3acd1;--vir:#ff5d8f;--wor:#3fd8c0;--tro:#ffb347}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1d2354,var(--bg) 55%);color:var(--tx);font:16px/1.55 "Trebuchet MS",Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:1020px;margin:auto;padding:0 18px}
header{padding:26px 0 8px}h1{margin:0;font-size:32px;letter-spacing:.3px}header p{margin:4px 0 0;color:var(--mut)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
.tcard{background:var(--card);border:2px solid transparent;border-radius:16px;padding:18px;text-align:center;cursor:pointer;color:var(--tx);font:inherit;transition:transform .2s,border-color .2s}
.tcard:hover{transform:translateY(-4px)}.tcard:focus-visible{outline:3px solid #fff}
.tcard .e{font-size:46px;display:block}.tcard b{font-size:20px}.tcard small{display:block;color:var(--mut)}
.tcard.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.lab{background:var(--card);border-radius:18px;padding:20px;border-top:6px solid var(--c)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top h2{margin:0;font-size:24px;color:var(--c)}.top span{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{background:var(--card2);border-radius:20px;padding:4px 12px;font-size:13px}.chip b{color:var(--c)}
canvas{width:100%;display:block;border-radius:12px;background:#12163a}
.cap{background:var(--card2);border-left:5px solid var(--c);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:17px;min-height:50px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.b{border:0;border-radius:10px;padding:10px 18px;font:700 15px inherit;cursor:pointer;background:var(--c);color:#10132b}
.b.g{background:var(--card2);color:var(--tx)}.b:focus-visible{outline:3px solid #fff}
#out{margin-left:auto;font-weight:700;color:var(--c);font-size:17px}
.prog{height:6px;background:var(--card2);border-radius:3px;margin-top:12px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--c)}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.ib{background:var(--card);border-radius:14px;padding:16px}.ib h3{margin:0 0 6px;font-size:17px}.ib ul{margin:0;padding-left:18px;color:#d4daf3;font-size:14.5px}.ib li{margin:5px 0}
footer{text-align:center;color:var(--mut);font-size:13px;padding:6px 0 28px}
@media(max-width:760px){.pick,.info{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body><div class="wrap">
<header><h1>🛡️ Malware Threat Lab</h1><p>CNS ALA-2: pick a threat, watch it run, then read how to stop it.</p></header>
<div class="pick" id="pick">
<button class="tcard" data-k="vir" style="--c:var(--vir)"><span class="e">🦠</span><b>Virus</b><small>Hides inside files</small></button>
<button class="tcard" data-k="wor" style="--c:var(--wor)"><span class="e">🐛</span><b>Worm</b><small>Spreads by itself</small></button>
<button class="tcard" data-k="tro" style="--c:var(--tro)"><span class="e">🐴</span><b>Trojan Horse</b><small>Pretends to be safe</small></button></div>

<section class="lab" id="lab">
<div class="top"><h2 id="ttl"></h2><span id="sub"></span></div>
<div class="chips" id="chips"></div>
<canvas id="cv" width="900" height="340"></canvas>
<div class="prog"><i id="pg"></i></div>
<div class="cap" id="cap"></div>
<div class="ctl"><button class="b" id="go">▶ Start animation</button><button class="b g" id="rs">↻ Reset</button><button class="b g" id="sp">Speed: 1x</button><div id="out"></div></div>
</section>

<div class="info" id="info"></div>
<footer>Educational simulation only. No real files, devices or networks are accessed.</footer></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lp=(a,b,t)=>a+(b-a)*t;
const em=(s,x,y,z)=>{g.font=z+'px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)};
const tx=(s,x,y,z,c,a='center')=>{g.font='bold '+z+'px "Trebuchet MS",sans-serif';g.fillStyle=c;g.textAlign=a;g.textBaseline='middle';g.fillText(s,x,y)};
const rr=(x,y,w,h,r,f,s)=>{g.beginPath();g.roundRect(x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(s){g.strokeStyle=s;g.lineWidth=2;g.stroke()}};
const ring=(x,y,p,c)=>{if(p>0&&p<1){g.strokeStyle=c;g.globalAlpha=1-p;g.lineWidth=3;g.beginPath();g.arc(x,y,10+p*45,0,7);g.stroke();g.globalAlpha=1}};

const D={
vir:{c:'#ff5d8f',n:'Virus',sub:'File-attached malware',end:10,chips:[['Needs host file','Yes'],['Needs user action','Yes'],['Self-replicates','Yes']],
 steps:[[0,'1. A virus hides inside an innocent-looking file, here an email attachment.'],[2,'2. The user opens the attachment. A virus cannot run without this click.'],[3.6,'3. The virus code attaches itself to other files on the computer.'],[8,'4. Infected files get corrupted, and sharing them spreads the virus further.']],
 thr:['Hides in .exe files, Office macros and email attachments','Spreads when an infected file is opened, copied or shared (USB, email)','Can stay dormant until a trigger (like a date) arrives'],
 sol:['Install antivirus and keep it updated','Never open unknown attachments; disable macros','Scan USB drives and keep offline backups'],
 harm:['Corrupts or deletes files','Slows down or crashes the system','Makes programs unusable']},
wor:{c:'#3fd8c0',n:'Worm',sub:'Self-spreading network malware',end:11,chips:[['Needs host file','No'],['Needs user action','No'],['Self-replicates','Yes']],
 steps:[[0,'1. A worm is a standalone program. It needs no host file.'],[1,'2. One computer with an unpatched weakness gets infected.'],[2.6,'3. With no user click, the worm scans and copies itself to connected computers.'],[9,'4. Copies multiply so fast that the network gets overloaded.']],
 thr:['Exploits unpatched software bugs (WannaCry used the SMBv1 flaw)','Spreads over networks, shares and email with zero clicks','Can carry other payloads such as ransomware'],
 sol:['Install security updates quickly','Use firewalls and close unused ports','Segment the network and monitor unusual traffic'],
 harm:['Eats bandwidth and crashes servers','Causes network-wide outages','Can install backdoors or ransomware']},
tro:{c:'#ffb347',n:'Trojan Horse',sub:'Disguised malware',end:11,chips:[['Needs host file','No'],['Needs user action','Yes (install)'],['Self-replicates','No']],
 steps:[[0,'1. A trojan pretends to be useful software, here a free game.'],[2,'2. The user decides to install it, trusting the look of it.'],[3,'3. Installing... everything seems normal.'],[5,'4. The disguise drops. A hidden payload opens a backdoor.'],[5.8,'5. The attacker secretly steals passwords, files and photos.'],[10,'6. It never copies itself. It only works because the user trusted it.']],
 thr:['Disguised as games, cracked software or fake updates','Opens a backdoor for remote control','Downloads more malware and logs keystrokes'],
 sol:['Download only from official stores and sites','Check digital signatures or file hashes','Use limited user accounts and security software'],
 harm:['Stolen passwords and banking data','Attacker controls your computer','Spyware or ransomware installed secretly']}};

const PC=[];
function pc(x,y,col,sz=44){if(col){g.fillStyle=col;g.globalAlpha=.25;g.beginPath();g.arc(x,y,sz*.75,0,7);g.fill();g.globalAlpha=1}em('💻',x,y,sz)}

/* ---- scenes: draw & return output text ---- */
const files=['doc.docx','game.exe','photo.jpg','notes.txt','sheet.xlsm','song.mp3'];
function sVir(t){let n=0;pc(90,200,t>3.6?D.vir.c:0);tx('Your PC',90,255,14,'#a3acd1');
 // email attachment travels in
 const a=cl(t/2);if(t<3.6){em('📎',lp(30,90,a),lp(60,125,a),38);tx('invoice.docm',lp(30,90,a),lp(95,160,a),13,'#ffd0de')}
 if(t>=1.9&&t<3)ring(90,200,(t-1.9)/1.1,'#fff');if(t>=2&&t<3.6)em('🖱️',110,150,28);
 files.forEach((f,i)=>{const x=250+i*105,inf=i<5,T=3.6+i*.7,p=cl((t-T)/.5);
  if(inf&&t>=3.6){g.strokeStyle='#ff5d8f';g.lineWidth=3;g.globalAlpha=1-(p>=1?.7:0);g.beginPath();g.moveTo(130,200);g.lineTo(lp(130,x,p),lp(200,200,p));g.stroke();g.globalAlpha=1}
  const hit=inf&&p>=1,sh=hit&&t>8?Math.sin(t*40+i)*3:0;if(hit)n++;
  rr(x-38+sh,165,76,86,10,hit?'#5a1633':'#2b3166',hit?'#ff5d8f':'#4b5499');em(hit&&t>8?'💥':'📄',x+sh,200,32);if(hit)em('☣️',x+26,174,18);
  tx(f,x,236,12,hit?'#ffd0de':'#a3acd1')});
 if(t>8)tx('✖ Files corrupted',560,300,20,'#ff5d8f');
 return 'Infected files: '+n+' / 6'}

const N=[[110,170],[260,80],[260,260],[430,60],[430,170],[430,280],[620,90],[620,240],[790,170]],
E=[[0,1],[0,2],[1,3],[1,4],[2,4],[2,5],[3,6],[4,6],[4,7],[5,7],[6,8],[7,8]],P=[0,0,0,1,1,2,3,4,6],Dp=[0,1,1,2,2,2,3,3,4];
function sWor(t){const it=N.map((_,i)=>1+Dp[i]*1.8);let n=0;
 g.strokeStyle='#39407a';g.lineWidth=2;E.forEach(([a,b])=>{g.beginPath();g.moveTo(...N[a]);g.lineTo(...N[b]);g.stroke()});
 N.forEach((p,i)=>{if(i){const s=it[i]-1.2,q=cl((t-s)/1.2);if(q>0&&q<1){const A=N[P[i]],x=lp(A[0],p[0],q),y=lp(A[1],p[1],q);g.strokeStyle='#3fd8c0';g.lineWidth=4;g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(x,y);g.stroke();g.fillStyle='#ff5d8f';g.beginPath();g.arc(x,y,7,0,7);g.fill()}}});
 N.forEach((p,i)=>{const inf=t>=it[i];if(inf)n++;const sh=inf&&t>9?Math.sin(t*35+i)*3:0;
  if(inf){ring(p[0],p[1],(t*.8)%1,'#ff5d8f')}pc(p[0]+sh,p[1],inf?'#ff5d8f':'#7a84c9',40);tx(inf?'infected':'safe',p[0],p[1]+38,12,inf?'#ff9ab8':'#a3acd1')});
 tx('🐛 No user clicks anywhere',450,318,15,'#3fd8c0');
 if(t>9)tx('⚠ NETWORK OVERLOADED',450,22,22,'#ff5d8f');
 return 'Infected computers: '+n+' / 9'}

function sTro(t){pc(100,190,t>5?D.tro.c:0);tx('Your PC',100,245,14,'#a3acd1');
 const front=t<5;let sc=1;if(t>4.7&&t<5.3)sc=Math.abs(Math.cos((t-4.7)/.6*Math.PI/2*2-Math.PI/2*0))*1;
 if(t>4.7&&t<5.3)sc=Math.abs(1-(t-4.7)/.3);if(t>=5&&t<5.3)sc=(t-5)/.3;
 g.save();g.translate(450,150);g.scale(Math.max(sc,.02),1);
 if(front){rr(-115,-70,230,140,14,'#2b3166','#8fd68f');em('🎮',-70,-25,40);tx('Free Game',20,-35,19,'#fff');tx('★★★★★ 1M downloads',22,-8,12,'#ffd27a');
  const pr=cl((t-3)/2);if(t<3){rr(-60,20,120,32,8,'#4caf50');tx(t>2?'Installing…':'Install',0,36,15,'#fff')}else{rr(-90,28,180,16,8,'#12163a');rr(-90,28,180*pr,16,8,'#4caf50')}}
 else{rr(-115,-70,230,140,14,'#4a1d2d','#ff5d8f');em('🐴',-70,-20,44);tx('TROJAN!',25,-30,22,'#ff7a9a');tx('hidden payload running',25,0,12,'#ffd0de');tx('backdoor: OPEN',0,40,14,'#ffb347')}
 g.restore();if(t>=2&&t<3)ring(450,170,t-2,'#fff');if(t>=2&&t<3)em('🖱️',480,180,26);
 g.globalAlpha=cl((t-5.3)/.7);em('😈',790,190,50);tx('Attacker server',790,245,14,'#a3acd1');
 if(t>5.5){g.setLineDash([8,8]);g.strokeStyle='#ff5d8f';g.lineWidth=2;g.beginPath();g.moveTo(150,285);g.lineTo(740,285);g.stroke();g.setLineDash([])}g.globalAlpha=1;
 let st=0;[['🔑',6],['📁',7.2],['📷',8.4]].forEach(([e,s])=>{const q=cl((t-s)/1.6);if(q>0){if(q<1)em(e,lp(150,740,q),285,28);else st++}});
 tx(st?'Stolen data received: '+st+' / 3':'',450,318,15,'#ff9ab8');
 return 'Copies of itself: 0 · Data stolen: '+st+' / 3'}

/* ---- engine ---- */
const S={vir:sVir,wor:sWor,tro:sTro};let k='vir',tm=0,run=false,t0=0,spd=1;
function draw(){g.clearRect(0,0,900,340);const d=D[k];g.globalAlpha=1;const o=S[k](tm);
 let c=d.steps[0][1];d.steps.forEach(([s,m])=>{if(tm>=s)c=m});
 $('#cap').textContent=run||tm>0?c:'Press “Start animation” to see how it works.';$('#out').textContent=tm>0?o:'';$('#pg').style.width=tm/d.end*100+'%'}
function frame(n){if(run){tm=Math.min((n-t0)/1000*spd,D[k].end);if(tm>=D[k].end){run=false;$('#go').textContent='▶ Play again'}}draw();requestAnimationFrame(frame)}
function pick(key){k=key;const d=D[key];run=false;tm=0;document.querySelectorAll('.tcard').forEach(b=>b.classList.toggle('on',b.dataset.k==key));
 $('#lab').style.setProperty('--c',d.c);$('#ttl').textContent=d.n;$('#sub').textContent=d.sub;$('#go').textContent='▶ Start animation';
 $('#chips').innerHTML=d.chips.map(c=>`<span class="chip">${c[0]}: <b>${c[1]}</b></span>`).join('');
 const li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
 $('#info').style.setProperty('--c',d.c);$('#info').innerHTML=`<div class="ib"><h3>❗ Threats</h3>${li(d.thr)}</div><div class="ib"><h3>🛡️ Solution</h3>${li(d.sol)}</div><div class="ib"><h3>⚠️ Harmful effects</h3>${li(d.harm)}</div>`;start()}
function start(){tm=0;run=true;t0=performance.now();$('#go').textContent='▶ Playing…'}
document.querySelectorAll('.tcard').forEach(b=>b.onclick=()=>pick(b.dataset.k));
$('#go').onclick=start;$('#rs').onclick=()=>{run=false;tm=0;$('#go').textContent='▶ Start animation'};
$('#sp').onclick=()=>{const was=tm/spd;spd=spd==1?.5:1;$('#sp').textContent='Speed: '+spd+'x';t0=performance.now()-tm*1000/spd};
pick('vir');requestAnimationFrame(frame);
</script></body></html>
